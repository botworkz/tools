[package]
name = "shasset"
version = "0.1.0"
edition = "2021"
description = "Generic verified-asset downloader and registry manager"
license = "GPL-3.0-or-later"

[lib]
name = "shasset"
path = "src/lib.rs"

[[bin]]
name = "shasset"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
hex = "0.4"
rayon = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
