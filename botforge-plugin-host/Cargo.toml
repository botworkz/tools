[package]
name = "botforge-plugin-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Host for botforge .so FFI plugins; the sole sanctioned location for unsafe code in this workspace"

[lib]
name = "botforge_plugin_host"
path = "src/lib.rs"

# `unsafe_code = "forbid"` is intentionally absent from this crate.
# See the root Cargo.toml workspace-lint comment for the full policy
# rationale: this is the designated blast-radius container for all
# .so / FFI-loading code in the botforge plugin system.
[dependencies]
libloading = "0.8"
thiserror = "2"

[lints]
workspace = true
