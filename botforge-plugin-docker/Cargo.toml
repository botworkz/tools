[package]
name = "botforge-plugin-docker"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Docker boot-time assert plugin for the botforge plugin system"

[lib]
name = "docker"
crate-type = ["cdylib"]

[dependencies]
botforge-plugin-host = { path = "../botforge-plugin-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
