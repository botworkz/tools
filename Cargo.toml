[workspace]
members = ["shasset", "botforge", "viscous", "botforge-plugin-host", "botforge-plugin-hello"]
exclude = ["viscous/tests/fixtures"]
resolver = "2"

# Workspace-wide lint policy. Inherited by every member crate via
# `[lints] workspace = true` in their `Cargo.toml`. The set is
# intentionally tiny.
#
# `unsafe_code` is intentionally NOT listed here. It has been moved to
# per-crate `#![forbid(unsafe_code)]` crate-level attributes so that
# each existing crate (`shasset`, `botforge`, `viscous`) keeps its
# "no `unsafe`" guarantee explicitly in source, while
# `botforge-plugin-host` — the one designated blast-radius container
# for all `.so`/FFI-loading code — is permitted to contain `unsafe`
# blocks without fighting the workspace gate.
#
# Each crate that forbids `unsafe` declares `#![forbid(unsafe_code)]`
# at the top of its crate root(s). `forbid` (vs `deny`) means a
# downstream `#![allow(unsafe_code)]` in a child module cannot
# re-enable it; any future PR that needs an `unsafe` block in those
# crates has to first remove that attribute in a stand-alone commit,
# which gets reviewed on its own merits.
#
# `botforge-plugin-host` omits `#![forbid(unsafe_code)]` by design —
# it is the sole sanctioned location for `unsafe` in this workspace.
# All other crates continue to forbid `unsafe` exactly as before.
#
# Any addition of `unsafe` outside `botforge-plugin-host` belongs in
# a separate PR with its own justification — this is a policy gate,
# not a style sheet.
[workspace.lints]
