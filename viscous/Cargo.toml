[package]
name = "viscous"
version = "0.1.0"
edition = "2021"
description = "Opinionated, agent-friendly directory template generator"
license = "MIT"

[lib]
name = "viscous"
path = "src/lib.rs"

[[bin]]
name = "viscous"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
liquid = "0.26"
liquid-core = "0.26"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
walkdir = "2"
heck = "0.5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
