[package]
name = "botforge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "botforge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
glob = "0.3"
guestfs = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shasset = { path = "../shasset" }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
