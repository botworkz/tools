[package]
name = "botforge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "botforge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bollard = "0.18"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
shasset = { path = "../shasset" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
