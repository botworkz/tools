[package]
name = "botforge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "botforge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
botforge-plugin-host = { path = "../botforge-plugin-host" }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1.1.9"
getrandom = { version = "0.4", features = ["sys_rng"] }
gix = { version = "0.70", default-features = false, features = ["index"] }
glob = "0.3"
globset = "0.4"
rayon = "1"
walkdir = "2"
russh = { version = "0.62.2", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shasset = { path = "../shasset" }
time = { version = "0.3", features = ["formatting"] }
object_store = { version = "0.14.1", features = ["aws"] }
tokio = { version = "1", features = ["fs", "rt", "net", "io-util", "time"] }
zstd = { version = "0.13.3", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3"

# botforge-plugin-host is a normal dependency declared here ahead of its first
# real consumer (load_plugin_entries), which arrives in the compressor/pigz PR.
# Remove this ignore block once that PR lands and the #[allow(dead_code)] on
# load_plugin_entries / PluginEntry is retired.
[package.metadata.cargo-udeps.ignore]
normal = ["botforge-plugin-host"]

[lints]
workspace = true
