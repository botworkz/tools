type: test
ports:
- 80

steps:
- on: host
  name: Host hello
  run: |
    hostname
    whoami
- on: guest
  name: Guest whoami
  run: |
    whoami | grep botforge
- on: guest
  name: Base install test
  sudo: true
  run: |
    whoami | grep root

    export DEBIAN_FRONTEND=noninteractive

    apt-get -qq update
    apt show python3-virtualenv | grep "APT-Manual-Installed: yes"
