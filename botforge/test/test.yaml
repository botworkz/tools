type: test
ports:
- 80

steps:
- uses: "@://hello.steps.yaml"
- name: Base install test
  run: |
    whoami | grep root

    export DEBIAN_FRONTEND=noninteractive

    apt-get -qq update
    apt show python3-virtualenv | grep "APT-Manual-Installed: yes"
- name: Expect non-zero exit with stdout check
  run: |
    echo "expected-output"
    exit 1
  expect:
    exit: 1
    stdout:
      contains:
      - expected-output
      not_contains:
      - unexpected-content
    stderr:
      not_contains:
      - fatal error

assert:
  files:
    /etc/botforge-ci-marker:
      filetype: file
      owner: root
      group: root
      mode: "644"
    /tmp/should-not-exist-botforge-ci-test:
      exists: false
    # Regression guard for #352 (assert.files: privileged probe).
    # 0440 root:root inside a 0750 root:root dir — the pre-#352 unprivileged
    # probe reported this absent; the privileged probe must see it as present.
    /etc/botforge-ci-restricted/probe-test:
      exists: true
      filetype: file
      owner: root
      group: root
      mode: "0440"
  packages:
    python3-virtualenv:
      installed: true
    telnet:
      installed: false
    python3-*:
      installed: true
  users:
    root:
      exists: true
      shell: /bin/bash
    botforge-*:
      exists: false
  groups:
    root:
      exists: true
    botforge-*:
      exists: false
  services:
    ssh:
      enabled: true
      active: true
