type: botforge/test
name: test
ports:
- 80

steps:
- uses: "@://hello.steps.yaml"
- uses: "@://for-fragment-test.steps.yaml"
- uses: "@://files-fragment.steps.yaml"
- uses: "@://env-threading.steps.yaml"
- name: caller sets env before fragment invoke
  run: |
    echo "CALLER_VAR=caller-ok" >> "$BF_ENV"
- uses: "@://env-scope-fragment.steps.yaml"
- name: caller cannot see fragment env after invoke
  run: |
    test "$CALLER_VAR" = caller-ok
    test -z "${FRAGMENT_VAR:-}"
    test "${FRAGMENT_VAR:-}" != frag-ok
- uses: "@://env-sibling-a.steps.yaml"
- uses: "@://env-sibling-b.steps.yaml"
- uses: "@://nested-outer.steps.yaml"
- uses: "@://outputs.steps.yaml"
# --- Stage 4: general runtime output refs --------------------------------------
# A plain run step emits typed output and a later sibling consumes it through
# `${{ steps.<run-id>.outputs.<name> }}` in the same scope.
- on: host
  name: emit run-step output
  id: host-emit
  run: |
    echo "count=11" >> "$BF_OUT"
  outputs:
  - name: count
    type: number
    required: true
- on: host
  name: consume run-step output
  run: |
    test "${{ steps.host-emit.outputs.count }}" = "11"
    echo "run-step-output-consumed"
  expect:
    stdout:
      contains:
      - run-step-output-consumed

# Stage 3 boundary path still works unchanged.
# The fragment emits typed values via $BF_OUT, re-exports them through its
# `outputs:` block, and the caller consumes them here via
# `${{ steps.fragout.outputs.<name> }}` — proving the coerced values flow out of
# the fragment boundary (including the `default:` fallback for a Null inner value).
- uses: "@://fragment-outputs.steps.yaml"
  id: fragout
- on: host
  name: consume fragment outputs
  run: |
    test "${{ steps.fragout.outputs.version }}" = "1.2.3"
    test "${{ steps.fragout.outputs.count }}" = "7"
    test "${{ steps.fragout.outputs.ready }}" = "true"
    test "${{ steps.fragout.outputs.fallback }}" = "fallback-default"
    echo "fragment-outputs-consumed"
  expect:
    stdout:
      contains:
      - fragment-outputs-consumed
- uses: "@://secret-output-masking.steps.yaml"
  id: secretfrag
- on: host
  name: consume secret fragment output
  run: |
    test "${{ steps.secretfrag.outputs.token }}" = "steel-toe-secret"
    echo "secret-fragment-output-consumed"
  expect:
    stdout:
      contains:
      - secret-fragment-output-consumed
- uses: "@://fragment-self-outputs.steps.yaml"
# --- Deferred `with:` resolution at the invocation boundary --------------------
# The admin fragment emits an OTP as a declared output; the user fragment
# consumes it via `otp: ${{ steps.admin.outputs.testuser_otp }}` in its `with:`
# block — resolved at runtime against the executed sibling, then bound to the
# child fragment's typed `otp` input.
- uses: "@://deferred-with-admin.steps.yaml"
  id: admin
  with:
    tenant: testuser
- uses: "@://deferred-with-user.steps.yaml"
  with:
    tenant: testuser
    otp: ${{ steps.admin.outputs.testuser_otp }}
- uses: "@://expressions.steps.yaml"
  with:
    str_a: hello
    str_b: hello
    booly: false
    booly_string: "false"
    seconds: 42
    cond: "yes"
    empty_str: ""
- name: Base install test
  run: |
    whoami | grep root

    export DEBIAN_FRONTEND=noninteractive

    apt-get -qq update
    apt show python3-virtualenv | grep "APT-Manual-Installed: yes"
- name: Expect non-zero exit with stdout check
  run: |
    echo "expected-output"
    exit 1
  expect:
    exit: 1
    stdout:
      contains:
      - expected-output
      not_contains:
      - unexpected-content
    stderr:
      not_contains:
      - fatal error
# --- for: expansion acceptance coverage --------------------------------------
# Exercises all three item forms with MULTIPLE items each, so iteration and the
# args.N / args.KEY addressing are genuinely tested (not a single-item no-op).
# Everything checked here is a real on-disk binary (NOT a shell builtin, so
# `command -v` resolves to a /path) guaranteed present on the minimal Debian
# cloud image, so the loops assert real, stable facts.

# 1. flat seq of scalars -> ${{ args.0 }}
- name: Loop scalar (${{ args.0 }})
  for: [cp, cat, ls]
  run: |
    command -v ${{ args.0 }}
  expect:
    stdout:
      contains:
      - /

# 2. seq of seqs -> ${{ args.0 }}, ${{ args.1 }}
- name: Loop seq (${{ args.0 }})
  for:
  - [cat, /usr/bin/cat]
  - [ls, /usr/bin/ls]
  run: |
    # args.0 is the binary name, args.1 its expected resolved path.
    resolved="$(command -v ${{ args.0 }})"
    test "$resolved" = "${{ args.1 }}"
    echo "${{ args.0 }} resolved-ok"
  expect:
    stdout:
      contains:
      - resolved-ok

# 3. seq of hashes -> ${{ args.KEY }}
- name: Loop assoc (${{ args.name }})
  for:
  - name: coreutils-cat
    bin: cat
  - name: coreutils-ls
    bin: ls
  run: |
    echo "checking ${{ args.name }}"
    command -v ${{ args.bin }}
  expect:
    stdout:
      contains:
      - /

# --- if: condition acceptance coverage ---------------------------------------
# Proves that `if: false` skips a step whose `run:` would fail if executed,
# and that `if: true` (explicit) still runs normally.

- name: if-false skips failing step
  if: false
  run: exit 1

- name: if-true runs normally
  if: true
  run: echo "if-true ran"
  expect:
    stdout:
      contains:
      - if-true ran

# for: with if: — proves the condition is cloned per iteration and substitution
# applies to if: before the literal check. Iteration 0 has if: "false" → skip,
# iteration 1 has if: "true" → run.
- name: for-if (${{ args.0 }})
  for:
  - ["skip-me", "false"]
  - ["run-me", "true"]
  if: ${{ from_json(args.1) }}
  run: echo "${{ args.0 }}"
  expect:
    stdout:
      contains:
      - run-me

assert:
  files:
    /etc/botforge-ci-marker:
      filetype: file
      owner: root
      group: root
      mode: "644"
    /tmp/botforge-fragment-file.txt:
      filetype: file
      owner: root
      group: root
      mode: "644"
    /tmp/should-not-exist-botforge-ci-test:
      exists: false
    # Regression guard for #352 (assert.files: privileged probe).
    # 0440 root:root inside a 0750 root:root dir — the pre-#352 unprivileged
    # probe reported this absent; the privileged probe must see it as present.
    /etc/botforge-ci-restricted/probe-test:
      exists: true
      filetype: file
      owner: root
      group: root
      mode: "0440"
  packages:
    python3-virtualenv:
      installed: true
    telnet:
      installed: false
    python3-*:
      installed: true
  users:
    root:
      exists: true
      shell: /bin/bash
    botforge-*:
      exists: false
  groups:
    root:
      exists: true
    botforge-*:
      exists: false
  services:
    ssh:
      enabled: true
      active: true
    # Positive services.environment assertion — the botwork-ci-env service is
    # created by the build with known Environment= entries.  This proves that
    # the environment: probe reads real systemd unit state.
    botwork-ci-env:
      enabled: true
      active: true
      environment:
        contains: ["BOTWORK_MODE=production"]
        not_contains: ["BOTWORK_SECRET"]
