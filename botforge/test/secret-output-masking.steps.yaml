type: botforge/fragment
steps:
- on: host
  name: emit secret output
  id: emit
  run: |
    echo "token=steel-toe-secret" >> "$BF_OUT"
    echo "TOKEN_FROM_ENV=steel-toe-secret" >> "$BF_ENV"
  outputs:
    token:
      type: secret
      required: true

- on: host
  name: consume secret in use sinks
  run: |
    test "${{ steps.emit.outputs.token }}" = "steel-toe-secret"
    test "$TOKEN_FROM_ENV" = "steel-toe-secret"
    echo "secret-use-sinks-ok"
  expect:
    stdout:
      contains:
      - secret-use-sinks-ok

outputs:
  token:
    type: secret
    from_step: emit
    from_output: token
    required: true
