type: botforge/fragment
# Negative-control fixture: the fragment declares a `required: true` output
# re-exporting an inner step value that is never emitted.  Boundary resolution
# must hard-fail after the inner steps run (inner Null, no default).
steps:
- on: host
  name: frag-required-missing-quiet
  id: quiet
  run: |
    # Intentionally emit nothing — the required fragment output must trigger
    # a hard failure at the invoke boundary.
    true
  outputs:
    val:
      type: string
      required: false

outputs:
  val:
    type: string
    value: ${{ steps.quiet.outputs.val }}
    required: true
