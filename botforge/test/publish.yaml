type: botforge/publish
name: ci-publish

steps:
- name: Create release notes
  run: |
    printf 'artifact: foo.qcow2\n' > build/artifact/RELEASE_NOTES.txt

publish:
  fs:
  - src: "@artifact://foo.qcow2"
    dest: build/publish/fs

  s3:
  - src: "@artifact://foo.qcow2"
    dest: s3://botforge-ci/publish
