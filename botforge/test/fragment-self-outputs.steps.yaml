type: botforge/fragment
steps:
- on: host
  name: self-out-emit
  id: emit
  run: |
    echo "version=9.9.9" >> "$BF_OUT"
  outputs:
    version:
      type: string
      required: true

- on: host
  name: self-out-quiet
  id: quiet
  run: |
    true
  outputs:
    maybe:
      type: string
      required: false

- on: host
  name: consume fragment-self outputs
  run: |
    test "${{ outputs.version }}" = "9.9.9"
    test "${{ outputs.fallback }}" = "self-default"
    echo "fragment-self-outputs-consumed"
  expect:
    stdout:
      contains:
      - fragment-self-outputs-consumed

outputs:
  version:
    type: string
    from_step: emit
    from_output: version
    required: true
  fallback:
    type: string
    from_step: quiet
    from_output: maybe
    default: "self-default"
