x-botforge-base: &botforge-base
  image: "${BOTFORGE_IMAGE:-ghcr.io/botworkz/tools/botforge}"
  user: "${HOST_UID:?}:${HOST_GID:?}"
  group_add:
  - "${HOST_KVM_GID}"
  working_dir: ${REPO_ROOT:-${PWD}}
  environment:
    HOME: /tmp
    XDG_CACHE_HOME: /tmp/.cache
    HOST_UID: ${HOST_UID}
    HOST_GID: ${HOST_GID}
    HOST_KVM_GID: ${HOST_KVM_GID}
    LIBGUESTFS_BACKEND: direct
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
  volumes:
  - ${REPO_ROOT:-${PWD}}:${REPO_ROOT:-${PWD}}

services:
  botforge:
    <<: *botforge-base
    devices:
    - /dev/kvm:/dev/kvm

  deps:
    <<: *botforge-base
