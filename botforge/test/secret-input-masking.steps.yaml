type: botforge/fragment

inputs:
  token:
    type: secret
    required: true

steps:
- on: host
  name: verify secret input in use sink
  run: |
    test "${{ inputs.token }}" = "steel-toe-secret"
    echo "secret-input-use-sink-ok"
  expect:
    stdout:
      contains:
      - secret-input-use-sink-ok

- on: host
  name: re-export secret input as secret output
  id: emit
  run: |
    echo "token=${{ inputs.token }}" >> "$BF_OUT"
  outputs:
    token:
      type: secret
      required: true

outputs:
  token:
    type: secret
    value: ${{ steps.emit.outputs.token }}
    required: true
