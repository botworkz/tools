type: botforge/test
name: assert-fail-output-forward-reference
ports:
- 80
steps:
- on: host
  name: consume-before-producer
  run: test "${{ steps.producer.outputs.value }}" = "ok"
- on: host
  name: producer
  id: producer
  run: echo "value=ok" >> "$BF_OUT"
  outputs:
    value:
      type: string
      required: true
assert:
  files: {}
