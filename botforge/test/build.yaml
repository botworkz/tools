type: build
image: >-
  @debian-base
output: foo.qcow2
disk_size: 10G
compress:
  reclaim: fstrim
steps:
- uses: "@://hello.steps.yaml"
- name: Base install
  run: |
    whoami | grep root

    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get -qq dist-upgrade -y
    apt-get -qq install -y python3-virtualenv
