type: build
image: >-
  @debian-base
output: foo.qcow2
disk_size: 10G
compress:
  reclaim: fstrim
cloud_init:
  write_files:
  - path: /etc/botforge-ci-marker
    content: "botforge-ci-test\n"
    permissions: "0644"
steps:
- uses: "@://hello.steps.yaml"
- name: Base install
  run: |
    whoami | grep root

    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get -qq dist-upgrade -y
    apt-get -qq install -y python3-virtualenv
