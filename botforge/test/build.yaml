type: build
image: >-
  @debian-base
disk_size: 10G
compress:
  reclaim: fstrim
steps:
- on: host
  name: Host hello
  run: |
    hostname
    whoami
- on: guest
  name: Guest whoami
  run: |
    whoami | grep botforge
- on: guest
  name: Base install
  sudo: true
  run: |
    whoami | grep root

    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get -qq dist-upgrade -y
    apt-get -qq install -y python-virtualenv
