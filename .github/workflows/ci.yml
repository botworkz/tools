# CI orchestrator for botworkz/tools.
#
# Release flow:
# - Keep VERSION at a pre-release value during development (e.g. 0.4.15-dev).
# - To cut a release, update VERSION to MAJOR.MINOR.PATCH (no suffix) and merge to main.
# - publish builds and pushes ghcr.io/botworkz/tools/<crate>:${VERSION} for
#   each crate in the matrix (shasset, botforge, viscous), and creates a
#   GitHub Release for v${VERSION} with the per-crate binaries attached.
# - On release: [published], bump advances VERSION to the next minor -dev
#   and pushes back to main.
# - If a clean VERSION sits on main for more than one push (e.g. a chore
#   commit lands before the next -dev bump), the publish job's Read VERSION
#   step probes the GitHub Releases API for v${VERSION} and warn-and-bails
#   on collision rather than silently overwriting GHCR tags or re-uploading
#   release assets.
name: CI

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/ci.yml
    - .github/workflows/_crate.yml
    - .github/workflows/_botforge.yml
    - .dockerignore
    - Earthfile
    - Makefile
    - tarpaulin.toml
    - VERSION
    - '**/Cargo.toml'
    - Cargo.lock
    - shasset/**
    - botforge/**
    - viscous/**
    - botforge-plugin-host/**
    - botforge-plugin-hello/**
    - botforge-plugin-hello-badabi/**
    - botforge-plugin-pigz/**
    - botforge-plugin-github/**
  pull_request:
    branches: [main]
    paths:
    - .github/workflows/ci.yml
    - .github/workflows/_crate.yml
    - .github/workflows/_botforge.yml
    - .dockerignore
    - Earthfile
    - Makefile
    - tarpaulin.toml
    - VERSION
    - '**/Cargo.toml'
    - Cargo.lock
    - shasset/**
    - botforge/**
    - viscous/**
    - botforge-plugin-host/**
    - botforge-plugin-hello/**
    - botforge-plugin-hello-badabi/**
    - botforge-plugin-pigz/**
    - botforge-plugin-github/**
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crate:
    strategy:
      fail-fast: false
      matrix:
        crate:
        - shasset
        - botforge
        - viscous
    uses: ./.github/workflows/_crate.yml
    with:
      crate: ${{ matrix.crate }}

  udeps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "udeps"
    - name: Install cargo-udeps
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-udeps
    - name: cargo udeps
      run: cargo +nightly udeps --workspace --all-targets --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: coverage
    - name: Install cargo-tarpaulin
      id: tarpaulin_install
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin
      continue-on-error: true
    - name: Fallback install cargo-tarpaulin
      if: steps.tarpaulin_install.outcome != 'success'
      run: cargo install cargo-tarpaulin --locked
    - name: Build plugin fixture cdylibs
      run: cargo build -p botforge-plugin-hello -p botforge-plugin-hello-badabi -p botforge-plugin-pigz -p botforge-plugin-github
    - name: Run unit test coverage
      run: cargo tarpaulin
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/tarpaulin/
        retention-days: 14
        if-no-files-found: error

  botforge:
    needs: crate
    strategy:
      fail-fast: false
      matrix:
        variant:
        - name: none
          compress_enabled: false
          compressor: ''
          compressor_opts: ''
        - name: zstd-default
          compress_enabled: true
          compressor: zstd
          compressor_opts: ''
        - name: zstd-aggressive
          compress_enabled: true
          compressor: zstd
          compressor_opts: '-19 -T0'
        - name: zlib
          compress_enabled: true
          compressor: zlib
          compressor_opts: ''
        - name: pigz
          compress_enabled: true
          compressor: pigz
          compressor_opts: ''
    uses: ./.github/workflows/_botforge.yml
    with:
      compress_enabled: ${{ matrix.variant.compress_enabled }}
      compressor: ${{ matrix.variant.compressor }}
      compressor_opts: ${{ matrix.variant.compressor_opts }}
      name: ${{ matrix.variant.name }}

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
    - crate
    - botforge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Read VERSION
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        raw="$(tr -d '[:space:]' < VERSION)"
        echo "version=${raw}" >> "$GITHUB_OUTPUT"
        if [[ "${raw}" == *-* ]]; then
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "VERSION=${raw} contains a pre-release suffix — skipping publish."
          exit 0
        fi
        tag="v${raw}"
        # `gh release view` exits 0 if the release exists, non-zero otherwise.
        # When VERSION is non-dev but a release for the tag already exists, the
        # publish path would silently overwrite ghcr.io/botworkz/tools/{shasset,
        # botforge,viscous}:${raw} container tags and re-upload binary assets
        # to the existing GitHub Release — all built from a different commit.
        # Refuse to do that: warn loudly and treat this run as a no-op.
        # Recovery is to bump VERSION (either to the next -dev for ongoing
        # development, or to the next MAJOR.MINOR.PATCH if you actually meant
        # to cut a new release).
        if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "::warning::VERSION=${raw} is non-dev but release ${tag} already exists — " \
               "refusing to republish (would overwrite ghcr.io/botworkz/tools/{shasset,botforge,viscous}:${raw} " \
               "and re-upload release assets from a different commit). Bump VERSION and re-run."
        else
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "VERSION=${raw} is a clean semver and ${tag} does not exist — proceeding with publish."
        fi

    - name: Log in to GHCR
      if: steps.version.outputs.is_release == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install EarthBuild
      if: steps.version.outputs.is_release == 'true'
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        base="https://github.com/EarthBuild/earthbuild/releases/download/v0.8.17"
        curl -fsSL -o "${tmp}/earth-linux-amd64" "${base}/earth-linux-amd64"
        curl -fsSL -o "${tmp}/checksum.asc" "${base}/checksum.asc"
        ( cd "${tmp}" && grep ' earth-linux-amd64$' checksum.asc | sha256sum -c - )
        sudo install -m 0755 "${tmp}/earth-linux-amd64" /usr/local/bin/earthly
        earthly bootstrap

    - uses: actions/download-artifact@v4
      if: steps.version.outputs.is_release == 'true'
      with:
        pattern: '*-binary'
        path: .ci-artifacts

    - name: Publish container images
      if: steps.version.outputs.is_release == 'true'
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        for crate in shasset botforge viscous; do
          install -D -m 0755 ".ci-artifacts/${crate}-binary/${crate}" ".ci-prebuilt/${crate}/${crate}"
          earthly --push "+${crate}-image" --BINARY_SOURCE=prebuilt --TAG="${VERSION}"
        done

    - name: Collect release files
      if: steps.version.outputs.is_release == 'true'
      id: release_files
      run: |
        set -euo pipefail
        {
          echo 'files<<EOF'
          find .ci-artifacts -mindepth 2 -maxdepth 2 -type f | sort
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release and upload binaries
      if: steps.version.outputs.is_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        fail_on_unmatched_files: true
        files: ${{ steps.release_files.outputs.files }}

  bump:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute next minor dev version
      id: bump
      run: |
        set -euo pipefail
        tag="${{ github.event.release.tag_name }}"
        version="${tag#v}"
        version="${version%%-*}"
        IFS='.' read -r major minor patch <<< "${version}"
        next_minor=$(( minor + 1 ))
        next_version="${major}.${next_minor}.0-dev"
        echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"
        echo "Released: ${version} → next dev: ${next_version}"

    - name: Bump VERSION and commit
      run: |
        set -euo pipefail
        echo "${{ steps.bump.outputs.next_version }}" > VERSION
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add VERSION
        git commit -m "chore: bump VERSION to ${{ steps.bump.outputs.next_version }} [skip ci]"
        git push origin main