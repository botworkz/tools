name: packer-tools

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && ' and push' || '' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine version tag
      id: version
      run: |
        if [ -f VERSION ]; then
          echo "tag=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
        else
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: containers/packer-tools
        file: containers/packer-tools/Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        tags: |
          ghcr.io/botworkz/tools/packer-tools:latest
          ghcr.io/botworkz/tools/packer-tools:${{ steps.version.outputs.tag }}
