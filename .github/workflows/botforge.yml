name: botforge

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: botforge
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: cargo test
      run: cargo test --locked

    - name: cargo clippy
      run: cargo clippy --locked -- -D warnings

    - name: cargo fmt check
      run: cargo fmt --check
