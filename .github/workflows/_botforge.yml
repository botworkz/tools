# CI orchestrator for botworkz/tools.
name: Botforge acceptance

on:
  workflow_call:
    inputs:
      compress_enabled:
        type: boolean
        required: true
      compressor:
        type: string
        required: true
      compressor_opts:
        type: string
        default:
      name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  botforge:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Reclaim runner disk space
      uses: envoyproxy/toolshed/actions/diskspace@6a20085af231aba4c72d6866f94098343a8c5616
    - name: Enable KVM via udev
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Assert /dev/kvm is present (hard requirement — no TCG fallback)
      run: |
        set -euo pipefail
        if [[ ! -e /dev/kvm ]]; then
          echo "ERROR: /dev/kvm is unavailable." >&2
          echo "KVM is a hard requirement for this gate; no TCG fallback is accepted." >&2
          exit 1
        fi
        echo "KVM OK: $(ls -la /dev/kvm)"

    - run: |
        sudo apt-get update
        sudo apt-get -qq install -y guestfish qemu-utils --no-install-recommends

    # ── Plugin host acceptance tests ─────────────────────────────────────────
    # Build all plugin cdylibs first, then run the plugin-host acceptance tests
    # against the real compiled .so files.
    - name: Build plugin cdylibs (.so)
      run: |
        cargo build -p botforge-hello-plugin
        cargo build -p botforge-hello-badabi-plugin
        cargo build -p botforge-pigz-plugin
        cargo build -p botforge-github-plugin
        cargo build -p botforge-docker-plugin
    - name: Run plugin-host acceptance tests
      run: cargo test -p botforge-plugin-host

    - name: Download pre-built botforge binary
      uses: actions/download-artifact@v4
      with:
        name: botforge-binary
        path: .ci-prebuilt/botforge
    - name: Make botforge binary executable
      run: chmod +x .ci-prebuilt/botforge/botforge
    - name: Stage libpigz.so for container build
      run: |
        set -euo pipefail
        # Find the built libpigz.so (debug or release profile).
        so_path=""
        for dir in target/debug target/release; do
          if [[ -f "${dir}/libpigz.so" ]]; then
            so_path="${dir}/libpigz.so"
            break
          fi
        done
        if [[ -z "${so_path}" ]]; then
          echo "ERROR: libpigz.so not found in target/debug or target/release" >&2
          exit 1
        fi
        echo "Staging ${so_path} → .ci-plugins/libpigz.so"
        mkdir -p .ci-plugins
        cp "${so_path}" .ci-plugins/libpigz.so
    - name: Stage libgithub.so for container build
      run: |
        set -euo pipefail
        # Find the built libgithub.so (debug or release profile).
        so_path=""
        for dir in target/debug target/release; do
          if [[ -f "${dir}/libgithub.so" ]]; then
            so_path="${dir}/libgithub.so"
            break
          fi
        done
        if [[ -z "${so_path}" ]]; then
          echo "ERROR: libgithub.so not found in target/debug or target/release" >&2
          exit 1
        fi
        echo "Staging ${so_path} → .ci-plugins/libgithub.so"
        mkdir -p .ci-plugins
        cp "${so_path}" .ci-plugins/libgithub.so
    - name: Stage libdocker.so for container build
      run: |
        set -euo pipefail
        # Find the built libdocker.so (debug or release profile).
        so_path=""
        for dir in target/debug target/release; do
          if [[ -f "${dir}/libdocker.so" ]]; then
            so_path="${dir}/libdocker.so"
            break
          fi
        done
        if [[ -z "${so_path}" ]]; then
          echo "ERROR: libdocker.so not found in target/debug or target/release" >&2
          exit 1
        fi
        echo "Staging ${so_path} → .ci-plugins/libdocker.so"
        mkdir -p .ci-plugins
        cp "${so_path}" .ci-plugins/libdocker.so
    - name: Build botworkz/botforge:ci runtime image
      run: |
        set -euo pipefail
        docker buildx build \
          --platform linux/amd64 \
          --load \
          --build-arg BINARY_SOURCE=prebuilt \
          -t botworkz/botforge:ci \
          -f botforge/Dockerfile \
          .

    - run: |
        mkdir testrepo
        cp -a botforge/test/botforge.yaml testrepo/
        cp -a botforge/test/compose.yml testrepo/
        cp -a botforge/test/.botforge.env testrepo/
        cp -a botforge/test/hello.steps.yaml testrepo/
        cp -a botforge/test/assert-fail.yaml testrepo/
        cp -a botforge/test/for-fragment-build.steps.yaml testrepo/
        cp -a botforge/test/for-fragment-test.steps.yaml testrepo/
        cp -a botforge/test/files-fragment.steps.yaml testrepo/
        cp -a botforge/test/fragment-file-fixture.txt testrepo/
        cp -a botforge/test/assert-docker.yaml testrepo/
        cp -a botforge/test/assert-fail-docker-running.yaml testrepo/
        cp -a botforge/test/assert-fail-docker-network.yaml testrepo/
        cp -a botforge/test/assert-fail-docker-ports.yaml testrepo/
        cp -a botforge/test/assert-fail-docker-logs.yaml testrepo/
        cp -a botforge/test/assert-fail-svc-env.yaml testrepo/
    - name: Set runtime environment
      run: |
        {
          echo "BOTFORGE_IMAGE=botworkz/botforge:ci"
          echo "HOST_UID=$(id -u)"
          echo "HOST_GID=$(id -g)"
          echo "HOST_KVM_GID=$(getent group kvm | cut -d: -f3)"
          echo "SHASSET_CACHE=${GITHUB_WORKSPACE}/testrepo/.shasset-cache"
        } >> "$GITHUB_ENV"
        mkdir -p "${GITHUB_WORKSPACE}/testrepo/.shasset-cache"
    # Inline the shasset asset manifest INTO the workspace marker
    # (testrepo/botforge.yaml). botforge no longer reads a standalone
    # shasset.yaml — assets live under the marker's `assets:` block, located
    # solely via --context / the marker walk-up. The base marker fixture
    # (botforge/test/botforge.yaml) is an empty 0-byte file with nothing to
    # preserve, so we simply transcode botforge/test/shasset.yaml straight
    # into testrepo/botforge.yaml.
    - name: Inline shasset assets into the workspace marker (botforge.yaml)
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        output-path: testrepo/botforge.yaml
        input: botforge/test/shasset.yaml
    # Assert the fold actually happened: the marker MUST now carry the
    # debian-base asset used as build `image: "@debian-base"`. If assets are
    # missing here the whole acceptance run would fail later at image
    # resolution — this turns that into an early, explicit failure instead of
    # a confusing mid-build error.
    - name: Assert inline assets landed in the marker
      run: |
        set -euo pipefail
        if ! grep -q 'debian-base' testrepo/botforge.yaml; then
          echo "ERROR: inline assets fold failed — 'debian-base' not present in testrepo/botforge.yaml" >&2
          echo "----- testrepo/botforge.yaml -----" >&2
          cat testrepo/botforge.yaml >&2
          exit 1
        fi
        # Guard against silent regression to the removed standalone-file model:
        # there must be NO shasset.yaml in the workspace, and botforge must
        # resolve assets purely from the inline marker.
        if [[ -e testrepo/shasset.yaml ]]; then
          echo "ERROR: testrepo/shasset.yaml exists — botforge must resolve" \
               "assets inline from the marker, not a standalone file" >&2
          exit 1
        fi
        echo "Inline assets OK: debian-base present in marker; no standalone shasset.yaml"
    # Inject the docker assert plugin declaration into the workspace marker.
    # libdocker.so is staged into the runtime image at
    # /usr/share/botforge/plugins/libdocker.so, but the plugin system is
    # config-driven with NO autoload — so it must be declared in the marker
    # for the assert/docker capability to be wired. Without this the docker
    # assert configs fail with "no assert provider for verb 'docker'".
    # Done as a STRUCTURED jq merge into the marker (not a heredoc append) so
    # the output stays a single well-formed document.
    - name: Inject docker plugin declaration into workspace marker
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        output-path: testrepo/botforge.yaml
        input: testrepo/botforge.yaml
        filter: |
          . + {
            plugins: ((.plugins // []) + [
              {
                name: "docker",
                src: "/usr/share/botforge/plugins/libdocker.so",
                provides: ["assert/docker"]
              }
            ])
          }
    # Assert the docker plugin block actually landed as valid config.
    - name: Assert docker plugin declaration landed in the marker
      run: |
        set -euo pipefail
        if ! grep -q 'libdocker.so' testrepo/botforge.yaml; then
          echo "ERROR: docker plugin injection failed — 'libdocker.so' not present in testrepo/botforge.yaml" >&2
          echo "----- testrepo/botforge.yaml -----" >&2
          cat testrepo/botforge.yaml >&2
          exit 1
        fi
        echo "docker plugin declaration OK: libdocker.so present in marker"
    # Inject the pigz plugin declaration when the pigz compressor is in use.
    # Done as a STRUCTURED jq merge into the marker (not a heredoc append) so
    # the output stays a single well-formed document — the inline-assets step
    # emits compact single-line JSON, so a raw text append produced invalid
    # YAML ("}}}plugins:" with no separator).
    - name: Inject pigz plugin declaration into workspace marker
      if: inputs.compressor == 'pigz'
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        output-path: testrepo/botforge.yaml
        input: testrepo/botforge.yaml
        filter: |
          . + {
            plugins: ((.plugins // []) + [
              {
                name: "pigz",
                src: "/usr/share/botforge/plugins/libpigz.so",
                provides: ["build/compressor"]
              }
            ])
          }
    # Assert the pigz plugin block actually landed as valid config.
    - name: Assert pigz plugin declaration landed in the marker
      if: inputs.compressor == 'pigz'
      run: |
        set -euo pipefail
        if ! grep -q 'libpigz.so' testrepo/botforge.yaml; then
          echo "ERROR: pigz plugin injection failed — 'libpigz.so' not present in testrepo/botforge.yaml" >&2
          echo "----- testrepo/botforge.yaml -----" >&2
          cat testrepo/botforge.yaml >&2
          exit 1
        fi
        echo "pigz plugin declaration OK: libpigz.so present in marker"
    - name: Create build config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      id: build-config
      with:
        input-format: yaml-path
        options: -c
        input: botforge/test/build.yaml
    - name: Create build config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml
        options: -c
        output-path: testrepo/build.yaml
        input: |
          enabled: ${{ inputs.compress_enabled }}
          compressor: ${{ inputs.compressor }}
          compressor_opts: ${{ inputs.compressor_opts }}
          reclaim: fstrim
          config: ${{ steps.build-config.outputs.value }}
        filter: |
          . as $in
          | $in.config
          | .compress += (
              {}
              + (if $in.enabled != null and $in.enabled != ""
                 then {enabled: $in.enabled}
                 else {} end)
              + (if $in.compressor != null and $in.compressor != ""
                 then {compressor: $in.compressor}
                 else {} end)
              + (if $in.compressor_opts != null and $in.compressor_opts != ""
                 then {compressor_opts: $in.compressor_opts}
                 else {} end)
              + (if $in.reclaim != null and $in.reclaim != ""
                 then {reclaim: $in.reclaim}
                 else {} end)
            )
    - name: Create test config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      id: test-config
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/test.yaml
        input: botforge/test/test.yaml
    - name: Create assert-fail-leaked config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-leaked.yaml
        input: botforge/test/assert-fail-leaked.yaml
    - name: Create assert-fail-rootfile config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-rootfile.yaml
        input: botforge/test/assert-fail-rootfile.yaml
    - name: Create assert-docker config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-docker.yaml
        input: botforge/test/assert-docker.yaml
    - name: Create assert-fail-docker-running config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-docker-running.yaml
        input: botforge/test/assert-fail-docker-running.yaml
    - name: Create assert-fail-docker-network config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-docker-network.yaml
        input: botforge/test/assert-fail-docker-network.yaml
    - name: Create assert-fail-docker-ports config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-docker-ports.yaml
        input: botforge/test/assert-fail-docker-ports.yaml
    - name: Create assert-fail-docker-logs config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-docker-logs.yaml
        input: botforge/test/assert-fail-docker-logs.yaml
    - name: Create assert-fail-svc-env config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-svc-env.yaml
        input: botforge/test/assert-fail-svc-env.yaml

    - name: Print marker (botforge.yaml with inline assets)
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        options: -C
        input: testrepo/botforge.yaml
        print-output: true
    - name: Print build config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        options: -C
        input: testrepo/build.yaml
        print-output: true
    - name: Print test config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        options: -C
        input: testrepo/test.yaml
        print-output: true
    - name: Restore shasset cache
      id: shasset-cache
      uses: actions/cache/restore@v4
      with:
        path: testrepo/.shasset-cache
        key: shasset-botforge-v1-${{ hashFiles('botforge/test/shasset.yaml') }}
        restore-keys: |
          shasset-botforge-v1-

    - run: |
        . .botforge.env
        botforge build --spec build.yaml
      working-directory: testrepo

    - name: Sanity checks
      run: |
        qemu-img check -r all -f qcow2 testrepo/build/artifact/foo.qcow2
        sudo guestfish --ro -a testrepo/build/artifact/foo.qcow2 -i sh 'file /boot/vmlinuz*; ls -l /boot'

    # Regression guard: the build/compressor plugin must never create sidecar files.
    # Selecting a plugin compressor (e.g. pigz) must NOT produce a .gz artifact alongside
    # the original qcow2 — the plugin is a pure bytes→bytes capability, not a file writer.
    - name: Assert no plugin-compressor sidecar was created
      if: inputs.compressor == 'pigz'
      run: |
        set -euo pipefail
        gz_path="testrepo/build/artifact/foo.qcow2.gz"
        if [[ -f "${gz_path}" ]]; then
          echo "ERROR: ${gz_path} exists — plugin compressor must not create sidecar files!" >&2
          echo "Contents of testrepo/build/artifact/:" >&2
          ls -la testrepo/build/artifact/ >&2
          exit 1
        fi
        echo "Sidecar guard OK: ${gz_path} was not created (correct behaviour)"

    - name: Create chained build config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml
        output-path: testrepo/chained.yaml
        input: |
          type: botforge/build
          name: chained
          image: "@artifact://foo.qcow2"
          output: "foo-chained.qcow2"
          steps: []
    - name: Run chained build
      run: |
        . .botforge.env
        botforge build --spec chained.yaml
      working-directory: testrepo

    - name: Sanity check chained output
      run: |
        qemu-img check -r all -f qcow2 testrepo/build/artifact/foo-chained.qcow2
        sudo guestfish --ro -a testrepo/build/artifact/foo.qcow2 -i sh 'file /boot/vmlinuz*; ls -l /boot'

    - name: Run acceptance tests (cloud-init + assert + expect)
      run: |
        . .botforge.env
        botforge test \
          --test-config test.yaml
      working-directory: testrepo

    - name: Negative-control — deliberate assert failure must exit non-zero
      run: |
        set -euo pipefail
        . .botforge.env
        if botforge test \
             --test-config assert-fail.yaml; then
          echo "ERROR: botforge should have exited non-zero for a failing assertion" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected the failing assertion"
      working-directory: testrepo

    - name: Negative-control — leaked botforge-evil identity must fail
      run: |
        set -euo pipefail
        . .botforge.env
        # Regression guard for #351 (assert.groups: installer-exclusion).
        # Cloud-init creates botforge-evil user+group in the test VM; the
        # assert then requires no botforge-* user or group to exist — this
        # MUST fail, proving negatives bite and installer-exclusion is
        # exact-name only (botforge-evil is not the installer and is caught).
        if botforge test \
             --test-config assert-fail-leaked.yaml; then
          echo "ERROR: botforge should have exited non-zero for leaked botforge-evil identity" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected leaked botforge-evil identity"
      working-directory: testrepo

    - name: Negative-control — wrong root-only file assertion must fail
      run: |
        set -euo pipefail
        . .botforge.env
        # Regression guard for #352 (assert.files: privileged probe).
        # Asserts the wrong mode (0640) on the 0440 root:root fixture file —
        # botforge MUST fail, proving the privileged probe reads real state
        # rather than silently reporting absent or passing without checking.
        if botforge test \
             --test-config assert-fail-rootfile.yaml; then
          echo "ERROR: botforge should have exited non-zero for wrong root-only file assertion" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected wrong root-only file assertion"
      working-directory: testrepo

    - name: Run acceptance tests (docker assert)
      run: |
        . .botforge.env
        botforge test \
          --test-config assert-docker.yaml
      working-directory: testrepo

    - name: Negative-control — docker exited container must not pass running check
      run: |
        set -euo pipefail
        . .botforge.env
        # botwork-exited has no restart policy and exits immediately; asserting
        # it is running MUST fail, proving the running-state check bites on a
        # real daemon.
        if botforge test \
             --test-config assert-fail-docker-running.yaml; then
          echo "ERROR: botforge should have exited non-zero for running check on exited container" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected running assertion on exited container"
      working-directory: testrepo

    - name: Negative-control — wrong docker network attachment must fail
      run: |
        set -euo pipefail
        . .botforge.env
        # botwork-db is on botwork-internal only; asserting it is on
        # botwork-plugin MUST fail, proving network-membership checks bite.
        if botforge test \
             --test-config assert-fail-docker-network.yaml; then
          echo "ERROR: botforge should have exited non-zero for wrong network attachment" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected wrong network attachment"
      working-directory: testrepo

    - name: Negative-control — unpublished port assertion must fail
      run: |
        set -euo pipefail
        . .botforge.env
        # botwork-proxy has no published host ports; asserting it publishes
        # 80/tcp MUST fail, proving port checks distinguish published vs exposed.
        if botforge test \
             --test-config assert-fail-docker-ports.yaml; then
          echo "ERROR: botforge should have exited non-zero for unpublished port assertion" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected unpublished port assertion"
      working-directory: testrepo

    - name: Negative-control — missing docker log line must fail
      run: |
        set -euo pipefail
        . .botforge.env
        # Asserts a log substring that never appears (timeout 3 s).
        # MUST fail, proving logs.contains bites when the line is absent.
        if botforge test \
             --test-config assert-fail-docker-logs.yaml; then
          echo "ERROR: botforge should have exited non-zero for missing log line assertion" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected missing log line assertion"
      working-directory: testrepo

    - name: Negative-control — missing services.environment entry must fail
      run: |
        set -euo pipefail
        . .botforge.env
        # botwork-ci-env does not set BOTWORK_NONEXISTENT_VAR; asserting it
        # contains that key MUST fail, proving environment: checks bite.
        if botforge test \
             --test-config assert-fail-svc-env.yaml; then
          echo "ERROR: botforge should have exited non-zero for missing environment entry" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected missing environment entry"
      working-directory: testrepo

    # ── Publish acceptance ────────────────────────────────────────────────────
    # MinIO provides a local S3-compatible endpoint so the real `aws s3 cp`
    # code path is exercised in CI without any external cloud dependency.
    - run: cp -a botforge/test/publish.yaml testrepo/

    - name: Start MinIO (S3-compatible store for publish acceptance)
      run: |
        # testrepo_default is the Compose project network created by earlier
        # `docker compose run` invocations in the testrepo/ working directory.
        # Joining it lets the botforge container resolve "minio" by name.
        docker run -d \
          --name minio \
          --network testrepo_default \
          -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          quay.io/minio/minio server /data --console-address ":9001"

    - name: Wait for MinIO to be healthy
      run: |
        set -euo pipefail
        for i in $(seq 1 30); do
          if curl -sf http://localhost:9000/minio/health/live; then
            echo "MinIO is healthy"
            break
          fi
          echo "Waiting for MinIO... attempt ${i}/30"
          sleep 2
        done
        curl -sf http://localhost:9000/minio/health/live

    - name: Create S3 bucket in MinIO
      run: |
        AWS_ACCESS_KEY_ID=minioadmin \
        AWS_SECRET_ACCESS_KEY=minioadmin \
        AWS_DEFAULT_REGION=us-east-1 \
        aws --endpoint-url http://localhost:9000 s3 mb s3://botforge-ci

    - name: Set AWS environment for publish acceptance
      run: |
        # AWS_ENDPOINT_URL uses the container name "minio" so that the botforge
        # container (on the same testrepo_default Docker network) can reach it
        # via Docker's internal DNS.  The host-side verification steps below use
        # http://localhost:9000 instead (via the published port).
        {
          echo "AWS_ACCESS_KEY_ID=minioadmin"
          echo "AWS_SECRET_ACCESS_KEY=minioadmin"
          echo "AWS_DEFAULT_REGION=us-east-1"
          echo "AWS_ENDPOINT_URL=http://minio:9000"
        } >> "$GITHUB_ENV"

    - name: Run publish acceptance (fs + S3 via MinIO)
      run: |
        . .botforge.env
        botforge publish --spec publish.yaml
      working-directory: testrepo

    - name: Verify publish fs output
      run: |
        set -euo pipefail
        ls -lh testrepo/build/publish/fs/foo.qcow2
        echo "publish fs OK"

    - name: Verify publish S3 upload
      run: |
        set -euo pipefail
        AWS_ACCESS_KEY_ID=minioadmin \
        AWS_SECRET_ACCESS_KEY=minioadmin \
        AWS_DEFAULT_REGION=us-east-1 \
        aws --endpoint-url http://localhost:9000 s3 ls s3://botforge-ci/publish/
        echo "publish s3 OK"

    - name: Save shasset cache
      if: inputs.name == 'none' && steps.shasset-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: testrepo/.shasset-cache
        key: ${{ steps.shasset-cache.outputs.cache-primary-key }}
