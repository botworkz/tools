name: Botforge acceptance

on:
  workflow_call:
    inputs:
      compress_enabled:
        type: boolean
        required: true
      compressor:
        type: string
        required: true
      compressor_opts:
        type: string
        default:
      name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  botforge:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Reclaim runner disk space
      uses: envoyproxy/toolshed/actions/diskspace@6a20085af231aba4c72d6866f94098343a8c5616
    - name: Enable KVM via udev
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Assert /dev/kvm is present (hard requirement — no TCG fallback)
      run: |
        set -euo pipefail
        if [[ ! -e /dev/kvm ]]; then
          echo "ERROR: /dev/kvm is unavailable." >&2
          echo "KVM is a hard requirement for this gate; no TCG fallback is accepted." >&2
          exit 1
        fi
        echo "KVM OK: $(ls -la /dev/kvm)"

    - run: |
        sudo apt-get update
        sudo apt-get -qq install -y guestfish qemu-utils --no-install-recommends

    # ── Plugin host acceptance tests ─────────────────────────────────────────
    # Build the hello-world fixture cdylib first, then run the plugin-host
    # acceptance tests against the real compiled libhello.so.
    - name: Build plugin fixture cdylibs (.so)
      run: |
        cargo build -p botforge-plugin-hello
        cargo build -p botforge-plugin-hello-badabi
    - name: Run plugin-host acceptance tests
      run: cargo test -p botforge-plugin-host

    - name: Download pre-built botforge binary
      uses: actions/download-artifact@v4
      with:
        name: botforge-binary
        path: .ci-prebuilt/botforge
    - name: Make botforge binary executable
      run: chmod +x .ci-prebuilt/botforge/botforge
    - name: Build botworkz/botforge:ci runtime image
      run: |
        set -euo pipefail
        docker buildx build \
          --platform linux/amd64 \
          --load \
          --build-arg BINARY_SOURCE=prebuilt \
          -t botworkz/botforge:ci \
          -f botforge/Dockerfile \
          .

    - run: |
        mkdir testrepo
        cp -a botforge/test/botforge.yaml testrepo/
        cp -a botforge/test/compose.yml testrepo/
        cp -a botforge/test/.botforge.env testrepo/
        cp -a botforge/test/hello.steps.yaml testrepo/
        cp -a botforge/test/assert-fail.yaml testrepo/
        cp -a botforge/test/for-fragment-build.steps.yaml testrepo/
        cp -a botforge/test/for-fragment-test.steps.yaml testrepo/
        cp -a botforge/test/files-fragment.steps.yaml testrepo/
        cp -a botforge/test/fragment-file-fixture.txt testrepo/
    - name: Set runtime environment
      run: |
        {
          echo "BOTFORGE_IMAGE=botworkz/botforge:ci"
          echo "HOST_UID=$(id -u)"
          echo "HOST_GID=$(id -g)"
          echo "HOST_KVM_GID=$(getent group kvm | cut -d: -f3)"
        } >> "$GITHUB_ENV"
    # Inline the shasset asset manifest INTO the workspace marker
    # (testrepo/botforge.yaml). botforge no longer reads a standalone
    # shasset.yaml — assets live under the marker's `assets:` block, located
    # solely via --context / the marker walk-up. The base marker fixture
    # (botforge/test/botforge.yaml) is an empty 0-byte file with nothing to
    # preserve, so we simply transcode botforge/test/shasset.yaml straight
    # into testrepo/botforge.yaml.
    - name: Inline shasset assets into the workspace marker (botforge.yaml)
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        output-path: testrepo/botforge.yaml
        input: botforge/test/shasset.yaml
    # Assert the fold actually happened: the marker MUST now carry the
    # debian-base asset used as build `image: "@debian-base"`. If assets are
    # missing here the whole acceptance run would fail later at image
    # resolution — this turns that into an early, explicit failure instead of
    # a confusing mid-build error.
    - name: Assert inline assets landed in the marker
      run: |
        set -euo pipefail
        if ! grep -q 'debian-base' testrepo/botforge.yaml; then
          echo "ERROR: inline assets fold failed — 'debian-base' not present in testrepo/botforge.yaml" >&2
          echo "----- testrepo/botforge.yaml -----" >&2
          cat testrepo/botforge.yaml >&2
          exit 1
        fi
        # Guard against silent regression to the removed standalone-file model:
        # there must be NO shasset.yaml in the workspace, and botforge must
        # resolve assets purely from the inline marker.
        if [[ -e testrepo/shasset.yaml ]]; then
          echo "ERROR: testrepo/shasset.yaml exists — botforge must resolve" \
               "assets inline from the marker, not a standalone file" >&2
          exit 1
        fi
        echo "Inline assets OK: debian-base present in marker; no standalone shasset.yaml"
    - name: Create build config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      id: build-config
      with:
        input-format: yaml-path
        options: -c
        input: botforge/test/build.yaml
    - name: Create build config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml
        options: -c
        output-path: testrepo/build.yaml
        input: |
          enabled: ${{ inputs.compress_enabled }}
          compressor: ${{ inputs.compressor }}
          compressor_opts: ${{ inputs.compressor_opts }}
          reclaim: fstrim
          config: ${{ steps.build-config.outputs.value }}
        filter: |
          . as $in
          | $in.config
          | .compress += (
              {}
              + (if $in.enabled != null and $in.enabled != ""
                 then {enabled: $in.enabled}
                 else {} end)
              + (if $in.compressor != null and $in.compressor != ""
                 then {compressor: $in.compressor}
                 else {} end)
              + (if $in.compressor_opts != null and $in.compressor_opts != ""
                 then {compressor_opts: $in.compressor_opts}
                 else {} end)
              + (if $in.reclaim != null and $in.reclaim != ""
                 then {reclaim: $in.reclaim}
                 else {} end)
            )
    - name: Create test config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      id: test-config
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/test.yaml
        input: botforge/test/test.yaml
    - name: Create assert-fail-leaked config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-leaked.yaml
        input: botforge/test/assert-fail-leaked.yaml
    - name: Create assert-fail-rootfile config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        filter: '. + {image: "@artifact://foo.qcow2"}'
        output-path: testrepo/assert-fail-rootfile.yaml
        input: botforge/test/assert-fail-rootfile.yaml

    - name: Print marker (botforge.yaml with inline assets)
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        options: -C
        input: testrepo/botforge.yaml
        print-output: true
    - name: Print build config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        options: -C
        input: testrepo/build.yaml
        print-output: true
    - name: Print test config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml-path
        options: -C
        input: testrepo/test.yaml
        print-output: true
    - run: |
        . .botforge.env
        botforge build --spec build.yaml
      working-directory: testrepo

    - name: Sanity checks
      run: |
        qemu-img check -r all -f qcow2 testrepo/build/artifact/foo.qcow2
        sudo guestfish --ro -a testrepo/build/artifact/foo.qcow2 -i sh 'file /boot/vmlinuz*; ls -l /boot'

    - name: Create chained build config
      uses: envoyproxy/toolshed/actions/jq@6a20085af231aba4c72d6866f94098343a8c5616
      with:
        input-format: yaml
        output-path: testrepo/chained.yaml
        input: |
          type: botforge/build
          name: chained
          image: "@artifact://foo.qcow2"
          output: "foo-chained.qcow2"
          steps: []
    - name: Run chained build
      run: |
        . .botforge.env
        botforge build --spec chained.yaml
      working-directory: testrepo

    - name: Sanity check chained output
      run: |
        qemu-img check -r all -f qcow2 testrepo/build/artifact/foo-chained.qcow2
        sudo guestfish --ro -a testrepo/build/artifact/foo.qcow2 -i sh 'file /boot/vmlinuz*; ls -l /boot'

    - name: Run acceptance tests (cloud-init + assert + expect)
      run: |
        . .botforge.env
        botforge test \
          --test-config test.yaml
      working-directory: testrepo

    - name: Negative-control — deliberate assert failure must exit non-zero
      run: |
        set -euo pipefail
        . .botforge.env
        if botforge test \
             --test-config assert-fail.yaml; then
          echo "ERROR: botforge should have exited non-zero for a failing assertion" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected the failing assertion"
      working-directory: testrepo

    - name: Negative-control — leaked botforge-evil identity must fail
      run: |
        set -euo pipefail
        . .botforge.env
        # Regression guard for #351 (assert.groups: installer-exclusion).
        # Cloud-init creates botforge-evil user+group in the test VM; the
        # assert then requires no botforge-* user or group to exist — this
        # MUST fail, proving negatives bite and installer-exclusion is
        # exact-name only (botforge-evil is not the installer and is caught).
        if botforge test \
             --test-config assert-fail-leaked.yaml; then
          echo "ERROR: botforge should have exited non-zero for leaked botforge-evil identity" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected leaked botforge-evil identity"
      working-directory: testrepo

    - name: Negative-control — wrong root-only file assertion must fail
      run: |
        set -euo pipefail
        . .botforge.env
        # Regression guard for #352 (assert.files: privileged probe).
        # Asserts the wrong mode (0640) on the 0440 root:root fixture file —
        # botforge MUST fail, proving the privileged probe reads real state
        # rather than silently reporting absent or passing without checking.
        if botforge test \
             --test-config assert-fail-rootfile.yaml; then
          echo "ERROR: botforge should have exited non-zero for wrong root-only file assertion" >&2
          exit 1
        fi
        echo "Negative-control passed: botforge correctly rejected wrong root-only file assertion"
      working-directory: testrepo

    # ── Publish acceptance ────────────────────────────────────────────────────
    # MinIO provides a local S3-compatible endpoint so the real `aws s3 cp`
    # code path is exercised in CI without any external cloud dependency.
    - run: cp -a botforge/test/publish.yaml testrepo/

    - name: Start MinIO (S3-compatible store for publish acceptance)
      run: |
        # testrepo_default is the Compose project network created by earlier
        # `docker compose run` invocations in the testrepo/ working directory.
        # Joining it lets the botforge container resolve "minio" by name.
        docker run -d \
          --name minio \
          --network testrepo_default \
          -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          quay.io/minio/minio server /data --console-address ":9001"

    - name: Wait for MinIO to be healthy
      run: |
        set -euo pipefail
        for i in $(seq 1 30); do
          if curl -sf http://localhost:9000/minio/health/live; then
            echo "MinIO is healthy"
            break
          fi
          echo "Waiting for MinIO... attempt ${i}/30"
          sleep 2
        done
        curl -sf http://localhost:9000/minio/health/live

    - name: Create S3 bucket in MinIO
      run: |
        AWS_ACCESS_KEY_ID=minioadmin \
        AWS_SECRET_ACCESS_KEY=minioadmin \
        AWS_DEFAULT_REGION=us-east-1 \
        aws --endpoint-url http://localhost:9000 s3 mb s3://botforge-ci

    - name: Set AWS environment for publish acceptance
      run: |
        # AWS_ENDPOINT_URL uses the container name "minio" so that the botforge
        # container (on the same testrepo_default Docker network) can reach it
        # via Docker's internal DNS.  The host-side verification steps below use
        # http://localhost:9000 instead (via the published port).
        {
          echo "AWS_ACCESS_KEY_ID=minioadmin"
          echo "AWS_SECRET_ACCESS_KEY=minioadmin"
          echo "AWS_DEFAULT_REGION=us-east-1"
          echo "AWS_ENDPOINT_URL=http://minio:9000"
        } >> "$GITHUB_ENV"

    - name: Run publish acceptance (fs + S3 via MinIO)
      run: |
        . .botforge.env
        botforge publish --spec publish.yaml
      working-directory: testrepo

    - name: Verify publish fs output
      run: |
        set -euo pipefail
        ls -lh testrepo/build/publish/fs/foo.qcow2
        echo "publish fs OK"

    - name: Verify publish S3 upload
      run: |
        set -euo pipefail
        AWS_ACCESS_KEY_ID=minioadmin \
        AWS_SECRET_ACCESS_KEY=minioadmin \
        AWS_DEFAULT_REGION=us-east-1 \
        aws --endpoint-url http://localhost:9000 s3 ls s3://botforge-ci/publish/
        echo "publish s3 OK"
