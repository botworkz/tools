version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    cargo-minor-patch:
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  - rust

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions-all:
      patterns:
      - "*"
  labels:
  - dependencies
  - github-actions
